<title id="title">Visit Collector — Balanced primary</title>
<desc id="desc">A refined black C collects a blue and green V-shaped visitor, yellow head, and red arrival dot. Carefully balanced strokes and spacing preserve readability at small sizes. Icon only.</desc>
