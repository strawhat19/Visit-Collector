<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">Visit Collector — Balanced Collector</title><desc id="desc">A precisely circular red, blue and green C with aligned rounded terminals, a lighter near-black V, yellow visitor head and red arrival dot. Balanced spacing refines the original color collector.</desc><rect width="1024" height="1024" fill="#F8FAFC"/><g data-role="collector-c"><path d="M697.7862 344.7173A250 250 0 1 0 697.7862 679.2827" fill="none" stroke="#2563EB" stroke-width="80" stroke-linecap="round"/><path d="M697.7862 344.7173A250 250 0 0 0 335.2233 335.2233" fill="none" stroke="#E44747" stroke-width="80"/><path d="M335.2233 688.7767A250 250 0 0 0 697.7862 679.2827" fill="none" stroke="#159A63" stroke-width="80"/><circle cx="697.7862" cy="344.7173" r="40" fill="#E44747"/><circle cx="697.7862" cy="679.2827" r="40" fill="#159A63"/></g><path data-role="visitor-v" d="M402 463L512 626L622 463" fill="none" stroke="#15191F" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/><circle data-role="visitor-head" cx="512" cy="366" r="32" fill="#F4C542"/><circle data-role="arrival" cx="756" cy="512" r="36" fill="#E44747"/></svg>