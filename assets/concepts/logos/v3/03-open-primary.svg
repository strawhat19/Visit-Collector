<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Visit Collector — Open primary</title>
<desc id="desc">A refined black C collects a blue and green V-shaped visitor, yellow head, and red arrival dot. A wider C opening and diagonal color junction add movement. Icon only.</desc>
