<path d="M400 462L512 630L624 462" fill="none" stroke="#159A63" stroke-width="68" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#green-arm)"/>
<circle data-role="visitor-head" cx="512" cy="365" r="32" fill="#F4C542"/>
