<rect x="888" y="1152" width="792" height="528" rx="24" fill="#F8FAFC"/><svg x="1060" y="1172" width="448" height="448" viewBox="0 0 1024 1024"><title id="c5-title">Visit Collector — Compact Collector</title><desc id="c5-desc">A compact red, blue and green C with a heavier near-black V, a carefully spaced yellow head and red arrival dot. Stronger strokes and a wider aperture support small icon use.</desc><rect width="1024" height="1024" fill="#F8FAFC"/><g data-role="collector-c"><path d="M680.1073 337.9198A242 242 0 1 0 680.1073 686.0802" fill="none" stroke="#2563EB" stroke-width="96" stroke-linecap="round"/><path d="M680.1073 337.9198A242 242 0 0 0 340.8802 340.8802" fill="none" stroke="#E44747" stroke-width="96"/><path d="M340.8802 683.1198A242 242 0 0 0 680.1073 686.0802" fill="none" stroke="#159A63" stroke-width="96"/><circle cx="680.1073" cy="337.9198" r="48" fill="#E44747"/><circle cx="680.1073" cy="686.0802" r="48" fill="#159A63"/></g><path data-role="visitor-v" d="M414 466L512 616L610 466" fill="none" stroke="#15191F" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/><circle data-role="visitor-head" cx="512" cy="368" r="32" fill="#F4C542"/><circle data-role="arrival" cx="750" cy="512" r="36" fill="#E44747"/></svg><text x="920" y="1192" fill="#66778D" font-family="Helvetica,Arial,sans-serif" font-size="18">06</text><text x="1284" y="1648" text-anchor="middle" fill="#162C46" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="500">Compact collector</text>
