<path data-role="visitor-v" d="M402 463L512 626L622 463" fill="none" stroke="#2563EB" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M402 463L512 626L622 463" fill="none" stroke="#159A63" stroke-width="68" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#c0-green-arm)"/>
<circle data-role="visitor-head" cx="512" cy="366" r="32" fill="#F4C542"/>
<circle data-role="arrival-dot" cx="756" cy="512" r="36" fill="#E44747"/>
</g></svg><text x="80" y="88" fill="#66778D" font-family="Helvetica,Arial,sans-serif" font-size="18">01</text><text x="444" y="544" text-anchor="middle" fill="#162C46" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="500">Balanced primary</text>
<rect x="888" y="48" width="792" height="528" rx="24" fill="#F8FAFC"/><svg x="1060" y="68" width="448" height="448" viewBox="0 0 1024 1024"><title id="c1-title">Visit Collector — Balanced Collector</title><desc id="c1-desc">A precisely circular red, blue and green C with aligned rounded terminals, a lighter near-black V, yellow visitor head and red arrival dot. Balanced spacing refines the original color collector.</desc><rect width="1024" height="1024" fill="#F8FAFC"/><g data-role="collector-c"><path d="M697.7862 344.7173A250 250 0 1 0 697.7862 679.2827" fill="none" stroke="#2563EB" stroke-width="80" stroke-linecap="round"/><path d="M697.7862 344.7173A250 250 0 0 0 335.2233 335.2233" fill="none" stroke="#E44747" stroke-width="80"/><path d="M335.2233 688.7767A250 250 0 0 0 697.7862 679.2827" fill="none" stroke="#159A63" stroke-width="80"/><circle cx="697.7862" cy="344.7173" r="40" fill="#E44747"/><circle cx="697.7862" cy="679.2827" r="40" fill="#159A63"/></g><path data-role="visitor-v" d="M402 463L512 626L622 463" fill="none" stroke="#15191F" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/><circle data-role="visitor-head" cx="512" cy="366" r="32" fill="#F4C542"/><circle data-role="arrival" cx="756" cy="512" r="36" fill="#E44747"/></svg><text x="920" y="88" fill="#66778D" font-family="Helvetica,Arial,sans-serif" font-size="18">02</text><text x="1284" y="544" text-anchor="middle" fill="#162C46" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="500">Balanced collector</text>
<rect x="48" y="600" width="792" height="528" rx="24" fill="#F8FAFC"/><svg x="220" y="620" width="448" height="448" viewBox="0 0 1024 1024">
<title id="c2-title">Visit Collector — Open primary</title>
<desc id="c2-desc">A refined black C collects a blue and green V-shaped visitor, yellow head, and red arrival dot. A wider C opening and diagonal color junction add movement. Icon only.</desc>
<defs><clipPath id="c2-green-arm"><path d="M470.85 360H790V750H547.75Z"/></clipPath></defs>
<rect width="1024" height="1024" fill="#F8FAFC"/>
