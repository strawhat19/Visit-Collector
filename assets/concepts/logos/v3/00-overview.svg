<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="1728" viewBox="0 0 1728 1728"><title>Visit Collector — v3 refinements</title><desc>Primary color monograms on the left; color collector monograms on the right. Balanced, open or segmented, and compact variations.</desc><rect width="1728" height="1728" fill="#E8EDF3"/>
<rect x="48" y="48" width="792" height="528" rx="24" fill="#F8FAFC"/><svg x="220" y="68" width="448" height="448" viewBox="0 0 1024 1024">
<title id="c0-title">Visit Collector — Balanced primary</title>
<desc id="c0-desc">A refined black C collects a blue and green V-shaped visitor, yellow head, and red arrival dot. Carefully balanced strokes and spacing preserve readability at small sizes. Icon only.</desc>
