<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">Visit Collector — Segmented Collector</title><desc id="desc">A red, blue and green C separated by two precise three-degree gaps. Flat internal segment ends and rounded external terminals surround a near-black V and yellow visitor head, with a red arrival dot.</desc><rect width="1024" height="1024" fill="#F8FAFC"/><g data-role="collector-c"><path d="M697.7862 344.7173A250 250 0 0 0 339.9114 330.6564" fill="none" stroke="#E44747" stroke-width="84"/><path d="M330.6564 339.9114A250 250 0 0 0 330.6564 684.0886" fill="none" stroke="#2563EB" stroke-width="84"/><path d="M339.9114 693.3436A250 250 0 0 0 697.7862 679.2827" fill="none" stroke="#159A63" stroke-width="84"/><circle cx="697.7862" cy="344.7173" r="42" fill="#E44747"/><circle cx="697.7862" cy="679.2827" r="42" fill="#159A63"/></g><path data-role="visitor-v" d="M402 463L512 626L622 463" fill="none" stroke="#15191F" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/><circle data-role="visitor-head" cx="512" cy="366" r="32" fill="#F4C542"/><circle data-role="arrival" cx="756" cy="512" r="36" fill="#E44747"/></svg>