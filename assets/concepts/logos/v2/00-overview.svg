<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="1728" viewBox="0 0 1728 1728"><title>Visit Collector — refined VC logo variations</title><desc>Six refined V-inside-C concepts exploring black, red, green, yellow, and blue.</desc><rect width="1728" height="1728" fill="#E8EDF3"/>
