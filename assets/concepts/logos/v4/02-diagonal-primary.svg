<title id="title">Visit Collector — Diagonal primary</title>
<desc id="desc">A slender multicolor C with crisp separated color sections surrounds a multicolor V with true negative-space splits. Black and yellow dots keep the visitor and arrival symbols simple. Original VC identity with more internal space. Icon only.</desc>
