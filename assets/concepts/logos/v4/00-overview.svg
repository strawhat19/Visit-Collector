<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440"><title>Visit Collector — v4 light segmented monograms</title><desc>Four refinements with slimmer segmented Cs, multicolor Vs, and black and yellow dots.</desc><rect width="1440" height="1440" fill="#E8EDF3"/>
