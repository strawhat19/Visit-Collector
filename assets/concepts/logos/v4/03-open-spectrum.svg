<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">Visit Collector — Open Spectrum</title><desc id="desc">A spacious visitor monogram with a thin three-color C, precise radial color breaks, and a two-color V with an intact rounded vertex and a narrow diagonal break across the right arm. Black and yellow dots identify the visitor and arriving visit.</desc><defs><clipPath id="left"><polygon points="-100.0000,88.6147 1124.0000,894.2856 1124.0000,1124.0000 -100.0000,1124.0000"/></clipPath><clipPath id="right"><polygon points="-100.0000,-100.0000 1124.0000,-100.0000 1124.0000,882.3137 -100.0000,76.6428"/></clipPath></defs><rect width="1024" height="1024" fill="#F8FAFC"/><g data-role="collector-c"><path d="M685.6646 332.1650A250 250 0 0 0 341.5004 329.1616" fill="none" stroke="#2563EB" stroke-width="60"/><path d="M329.1616 341.5004A250 250 0 0 0 329.1616 682.4996" fill="none" stroke="#159A63" stroke-width="60"/><path d="M341.5004 694.8384A250 250 0 0 0 685.6646 691.8350" fill="none" stroke="#E44747" stroke-width="60"/><circle cx="685.6646" cy="332.1650" r="30" fill="#2563EB"/><circle cx="685.6646" cy="691.8350" r="30" fill="#E44747"/></g><g data-role="visitor-v"><path data-role="visitor-v-left" d="M408 464L512 622L616 464" fill="none" stroke="#2563EB" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#left)"/><path data-role="visitor-v-right" d="M408 464L512 622L616 464" fill="none" stroke="#159A63" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#right)"/></g><circle data-role="visitor-head" cx="512" cy="365" r="28" fill="#15191F"/><circle data-role="arrival" cx="756" cy="512" r="30" fill="#F4C542"/></svg>