<title id="title">Visit Collector — Interlocking primary</title>
<desc id="desc">The airy C is unchanged. The three-color V is reduced to slightly larger than the earlier version with dots, centered within the C. Both diagonal V gaps match the C segment centerline chord spacing of 15.269257 units. No visitor or arrival dots.</desc>
