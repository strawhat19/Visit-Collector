<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440"><title>Visit Collector — v6 reduced V and matched gaps</title><desc>Four refinements retain the airy C and use smaller three-color Vs. V segment gaps match the C centerline spacing. No dots.</desc><rect width="1440" height="1440" fill="#E8EDF3"/>
