<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440"><title>Visit Collector — v5 larger interlocking V</title><desc>Four refinements preserve the airy C and enlarge the V. Each V has two single-color arms and a contrasting diagonal junction. Visitor and arrival dots removed.</desc><rect width="1440" height="1440" fill="#E8EDF3"/>
